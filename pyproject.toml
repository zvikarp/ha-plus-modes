[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-plus-modes"
version = "0.2.0"
description = "Local household modes and temporary overrides for Home Assistant"
requires-python = ">=3.13"

[project.optional-dependencies]
test = ["pytest-homeassistant-custom-component==0.13.204", "home-assistant-frontend==20250109.0", "pycares==4.5.0", "ruff"]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.setuptools.package-data]
"custom_components.modes_plus" = ["*.json", "*.yaml", "frontend/*.js", "translations/*.json", "brand/*.png", "brand/*.svg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
