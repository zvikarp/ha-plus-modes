name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --no-deps homeassistant==2025.1.3 pytest-homeassistant-custom-component==0.13.204
      - name: Install HA-constrained test dependencies
        run: python -c "import homeassistant,pathlib,subprocess,sys; constraints=pathlib.Path(homeassistant.__file__).with_name('package_constraints.txt'); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '-c', str(constraints), '.[test]'])"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check custom_components/modes_plus/frontend/modes-plus.js
      - run: npm ci --ignore-scripts
      - run: npm test
