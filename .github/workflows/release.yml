name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump after the latest release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Run releases from the main branch." >&2
          exit 1
      - name: Prepare the next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: python scripts/release.py prepare "$BUMP"
      - name: Commit the version bump
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git diff --quiet; then
            echo "Version files already match ${TAG}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/modes_plus/manifest.json pyproject.toml
          git commit -m "chore: release ${TAG}"
          git push origin HEAD:main
      - name: Build HACS archive
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: python scripts/release.py package --tag "$TAG"
      - name: Create GitHub release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" modes_plus.zip \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG" \
            --generate-notes

  package:
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build HACS archive
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python scripts/release.py package --tag "$TAG"
      - uses: softprops/action-gh-release@v2
        with:
          files: modes_plus.zip
